<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e3a2a">
<title>校园绿镜 · Campus Green Mirror</title>
<link rel="preload" as="image" href="media/img/hero.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="media/img/icon-180.png">
<link rel="stylesheet" href="assets/css/main.css?v=20261124">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e3a2a'/%3E%3Cpath d='M9 23c0-8 5-13 14-13 0 9-5 13-14 13z' fill='%239ad3ad'/%3E%3Cpath d='M9 23c3-5 7-8 12-10' stroke='%230e3a2a' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#top" aria-label="home">
    <span class="brand-mark"><img src="media/img/mascot-mark.webp" alt="闪闪" width="160" height="160"></span>
  </a>
  <div class="langwrap" id="langWrap">
    <button class="langbtn" type="button" id="langBtn" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M3.2 9h17.6M3.2 15h17.6M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      <span id="langCur">中文</span>
      <svg class="chev" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="langmenu" id="langMenu" role="menu" hidden></div>
  </div>
</header>

<main id="app">

  <!-- 欢迎 -->
  <section class="hero" id="top">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-veil" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="kicker"><span class="kicker-line"></span><span id="heroKicker"></span></p>
      <div class="hero-logo">
        <img src="media/img/mascot.webp" alt="校园吉祥物 闪闪" width="760" height="760">
        <span class="mascot-name">闪闪</span>
      </div>
      <h1 class="school" id="schoolName"></h1>
      <p class="lead" id="heroLead"></p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="#choose" id="ctaPrimary"></a>
        <button class="btn btn-ghost" type="button" data-play-intro id="ctaSecondary"></button>
      </div>
      <ul class="stats" id="stats"></ul>
    </div>
    <a class="scroll-hint" href="#film" aria-hidden="true"><span></span></a>
  </section>

  <!-- 校园介绍影片 -->
  <section class="band film" id="film">
    <div class="wrap">
      <div class="band-head">
        <h2 id="filmTitle"></h2>
        <p id="filmText"></p>
      </div>
      <button class="film-card" type="button" data-play-intro id="filmCard">
        <span class="film-poster" id="filmPoster"></span>
        <span class="film-glow" aria-hidden="true"></span>
        <span class="play-btn" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>
        <span class="film-cap" id="filmCap"></span>
      </button>
      <div class="intro-audio" id="introAudio" hidden>
        <button class="audio-chip" type="button" id="introFullBtn" hidden>
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
          <span id="introFullLabel"></span>
        </button>
      </div>
    </div>
  </section>

  <!-- 选择社区 -->
  <section class="band choose" id="choose">
    <div class="wrap">
      <div class="band-head">
        <h2 id="chooseTitle"></h2>
        <p id="chooseSub"></p>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <footer class="foot">
    <div class="wrap foot-inner">
      <div>
        <p class="foot-school" id="footSchool"></p>
        <p class="foot-note" id="footNote"></p>
      </div>
      <button class="qr-cta" type="button" id="qrBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3z" fill="currentColor"/></svg>
        <span id="qrBtnText"></span>
      </button>
    </div>
  </footer>
</main>

<!-- 社区详情 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <button class="sheet-close" type="button" id="sheetClose" aria-label="close">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="sheet-hero" id="sheetHero">
      <div class="sheet-hero-img" id="sheetHeroImg"></div>
      <div class="sheet-hero-veil"></div>
      <div class="sheet-hero-txt">
        <div class="sheet-badge" id="sheetBadge" hidden></div>
        <p class="sheet-index" id="sheetIndex"></p>
        <h3 id="sheetName"></h3>
        <div class="chips" id="sheetTags"></div>
      </div>
    </div>
    <div class="sheet-body">
      <div class="sheet-tools" id="sheetTools"></div>
      <div class="audio-block" id="audioBlock" hidden></div>
      <div class="prose" id="sheetProse"></div>
      <div class="gallery-block" id="galleryBlock">
        <h4 id="galleryTitle"></h4>
        <div class="gallery" id="gallery"></div>
      </div>
    </div>
    <div class="sheet-nav">
      <button type="button" class="nav-btn" id="prevBtn"></button>
      <button type="button" class="nav-btn primary" id="backBtn"></button>
      <button type="button" class="nav-btn" id="nextBtn"></button>
    </div>
  </div>
</div>

<!-- 影片弹层 -->
<div class="modal" id="videoModal" hidden>
  <div class="modal-bg" data-close-modal></div>
  <div class="modal-box">
    <button class="sheet-close" type="button" data-close-modal aria-label="close">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <video id="player" controls playsinline preload="none" controlslist="nodownload"></video>
    <p class="modal-cap" id="videoCap"></p>
  </div>
</div>

<!-- 图片放大 -->
<div class="modal lightbox" id="lightbox" hidden>
  <div class="modal-bg" data-close-lightbox></div>
  <img id="lightboxImg" alt="">
</div>

<!-- 二维码 -->
<div class="modal qr-modal" id="qrModal" hidden>
  <div class="modal-bg" data-close-qr></div>
  <div class="qr-box">
    <img id="qrImg" alt="QR code">
    <p id="qrHint"></p>
    <p class="qr-url" id="qrUrl"></p>
  </div>
</div>

<!-- 校园 AI 问答：闪闪 -->
<button class="ai-fab" id="aiFab" type="button" aria-label="AI 问答" aria-expanded="false" aria-controls="aiPanel">
  <span class="ai-ring" aria-hidden="true"></span>
  <img class="ai-fab-img" src="media/img/mascot-mark.webp" alt="" width="160" height="160" aria-hidden="true">
  <span class="ai-spark" aria-hidden="true"></span>
  <span class="ai-fab-tip" id="aiFabTip"></span>
</button>

<div class="ai-panel" id="aiPanel" role="dialog" aria-modal="false" aria-labelledby="aiName" hidden>
  <div class="ai-head">
    <span class="ai-ava"><img src="media/img/mascot-mark.webp" alt="" aria-hidden="true"></span>
    <div class="ai-id">
      <b id="aiName">闪闪</b>
      <small id="aiSub">校园 AI 导览</small>
    </div>
    <button class="ai-x" id="aiClose" type="button" aria-label="close">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="ai-log" id="aiLog" aria-live="polite">
    <div class="ai-sugs" id="aiSugs" hidden></div>
  </div>
  <form class="ai-form" id="aiForm" autocomplete="off">
    <textarea id="aiText" rows="1" maxlength="300"></textarea>
    <button class="ai-send" id="aiSend" type="submit" aria-label="send">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V6M6 11.5L12 5.5l6 6" stroke="currentColor" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
  <p class="ai-note" id="aiNote"></p>
</div>

<script src="config.js"></script>
<script src="assets/js/qrcode.min.js"></script>
<script src="assets/js/app.js?v=20261124"></script>
</body>
</html>
